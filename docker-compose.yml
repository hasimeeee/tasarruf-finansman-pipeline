version: '3.8'

# MİMARİ:
#   postgres  →  ham/işlenmiş veri lokal
#   pipeline  →  ETL çalışır, veriyi işleyip hem lokal'e hem Neon'a yazar
#   Streamlit →  Neon'dan okur (Docker dışında, ayrı çalışır)

services:
  postgres:
    image: postgres:15
    container_name: tasarruf_db

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

    ports:
      - "5433:5432"   # DBeaver'dan localhost:5433 ile bağlanırsın

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d   # varsa başlangıç SQL'leri

    restart: always

  pipeline:
    build: .
    container_name: tasarruf_pipeline

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env

    environment:
      # Lokal DB (container içinde "postgres" host'u kullan, localhost değil!)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Neon bağlantısı .env'den gelir (NEON_DATABASE_URL)

    volumes:
      - .:/app
      - ./logs:/app/logs

    working_dir: /app

    restart: unless-stopped

volumes:
  postgres_data: